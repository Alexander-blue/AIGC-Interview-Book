name: Deploy VitePress site to GitHub Pages

"on":
  push:
    branches: [main, master]
  workflow_dispatch:

# 需要 contents: write 才能向 gh-pages 分支推送构建产物
permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      # build = vitepress build + postbuild.mjs（为每个干净 URL 生成 index.html）
      - name: Build with VitePress
        run: npm run build

      # 跳过 Jekyll 处理，保证中文目录 / 下划线文件都能被直接静态服务
      - name: Create .nojekyll
        run: touch docs/.vitepress/dist/.nojekyll

      # 用 git 方式推送到 gh-pages 分支（对 UTF-8 中文路径完全兼容，
      # 避免 actions/upload-pages-artifact 对中文目录 index.html 处理异常导致的 404）
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/.vitepress/dist
          publish_branch: gh-pages
          force_orphan: true
